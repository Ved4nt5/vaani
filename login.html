<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vaani — Login</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="vaani.png" width="140" height="90" alt="Vaani">
        <p class="auth-tagline">AI Voice to Text &amp; Summarizer</p>
      </div>

      <!-- ROLE SELECTION -->
      <div class="role-selector" id="roleSelector" role="tablist" aria-label="Select Role">
        <button type="button" class="role-btn" id="roleFacultyBtn" data-role="faculty">
          <i data-lucide="user" class="icon-default"></i> Faculty
        </button>
        <button type="button" class="role-btn active" id="roleStudentBtn" data-role="student">
          <i data-lucide="users" class="icon-default"></i> Student
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active">
        <h2 id="loginHeading">Student Login</h2>
        <p class="auth-subtitle" id="loginSubtitle">Enter your student credentials to continue</p>

        <label class="auth-label">
          <span id="loginEmailLabel">Student Email</span>
          <input type="email" id="loginEmail" placeholder="student@vaani.edu" required>
        </label>

        <label class="auth-label">
          Password
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </label>

        <button type="submit" class="auth-btn" id="loginBtn">Login as Student</button>

        <div class="auth-demo-hint" id="authDemoHint">
          <span>Quick Fill:</span>
          <button type="button" class="demo-pill" id="fillFacultyDemo"><i data-lucide="user" class="icon-default"></i> Faculty Account</button>
          <button type="button" class="demo-pill" id="fillStudentDemo"><i data-lucide="users" class="icon-default"></i> Student Account</button>
        </div>

        <p class="auth-switch">
          Don't have an account? <a href="#" id="showSignup">Sign Up</a>
        </p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form">
        <h2 id="signupHeading">Create Student Account</h2>
        <p class="auth-subtitle" id="signupSubtitle">Sign up to start using Vaani</p>

        <label class="auth-label">
          Full Name
          <input type="text" id="signupName" placeholder="Your name" required>
        </label>

        <label class="auth-label">
          <span id="signupEmailLabel">Student Email</span>
          <input type="email" id="signupEmail" placeholder="you@gmail.com" required>
        </label>

        <label class="auth-label" id="signupDeptWrap" style="display:none;">
          Department
          <input type="text" id="signupDepartment" placeholder="e.g. Computer Engineering &amp; AI">
        </label>

        <label class="auth-label">
          Password
          <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
        </label>

        <button type="submit" class="auth-btn" id="signupBtn">Sign Up</button>

        <p class="auth-switch">
          Already have an account? <a href="#" id="showLogin">Login</a>
        </p>
      </form>

      <!-- OTP VERIFICATION -->
      <div id="otpSection" class="auth-form">
        <h2>Verify Your Email</h2>
        <p class="auth-subtitle">We sent a 6-digit code to <b id="otpEmailDisplay"></b></p>
        <div id="otpSmtpBadge" style="margin: 8px 0 14px; font-size: 12.5px; color: #4920c5; background: #f0eaff; padding: 7px 12px; border-radius: 7px; display: none; text-align: center;"></div>

        <label class="auth-label">
          Verification Code
          <input type="text" id="otpCode" placeholder="Enter 6-digit code" maxlength="6" pattern="[0-9]{6}" autocomplete="off" required>
        </label>

        <button type="button" class="auth-btn" id="verifyOtpBtn">Verify & Continue</button>

        <p class="auth-switch">
          Didn't receive the code? <a href="#" id="resendOtp">Resend</a>
        </p>
      </div>

      <div id="authError" class="auth-error"></div>
      <div id="authSuccess" class="auth-success"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
